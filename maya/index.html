<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0710">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <title>Maya 🎀</title>
  <meta name="description" content="Maya — conteúdo exclusivo 18+">
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="/maya/assets/hero.jpg?v=2" fetchpriority="high">
  <link rel="preload" as="font" href="/maya/assets/lobster.woff2" type="font/woff2" crossorigin>
  <style>html{background:#12050b}</style>
  <link rel="stylesheet" href="/maya/style.css">
</head>
<body>
  <main class="shell">
    <!-- FOTO DE FUNDO: troque o arquivo assets/hero.jpg (mesmo nome) -->
    <img class="hero" src="/maya/assets/hero.jpg?v=2" alt="" fetchpriority="high">
    <div class="overlay" aria-hidden="true"></div>

    <section class="content">
      <h1 class="name">Maya 🎀</h1>
      <p class="handle">@_maya.vl<img class="verified" src="/maya/assets/verified.png" alt="Perfil verificado" title="Perfil verificado" width="14" height="14"></p>

      <p class="cue">ESTOU AQUI <span aria-hidden="true">👇</span></p>

      <nav class="ctas" aria-label="Links">
        <a class="btn btn--telegram" data-link="telegram" rel="noopener">
          <span class="btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </span>
          <span class="btn__label">PRÉVIAS TELEGRAM</span>
        </a>

        <a class="btn btn--site" data-link="privacy" rel="noopener">
          <span class="btn__icon" aria-hidden="true">
            <img src="/maya/assets/navegador.png" alt="" width="22" height="22" decoding="async">
          </span>
          <span class="btn__label">NÃO TEM TELEGRAM? CLIQUE AQUI</span>
          <span class="btn__badge" aria-hidden="true"><span><svg viewBox="0 0 24 24" width="12" height="12"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></span></span>
        </a>
      </nav>

      <p class="note">18+ • conteúdo exclusivo</p>
    </section>
  </main>

  <script src="/maya/script.js" defer></script>
</body>
</html>
